[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orbi-eval08-automation-idempotency"
version = "0.1.0"
description = "Orbi EVAL-08 Core Reliability Spike: Automation Idempotency, RFC 8785 JCS, Version Fencing & Atomic Claim/Task Creation"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2.0",
    "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
