services:
  orbi-eval08-postgres:
    image: postgres:16-alpine
    container_name: orbi-eval08-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbi_eval04_pass}
      POSTGRES_DB: ${POSTGRES_DB:-orbi_eval08}
    ports:
      - "54328:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbi -d orbi_eval08"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - eval08_pgdata:/var/lib/postgresql/data

volumes:
  eval08_pgdata:
